name: Capture macOS Screenshots

on:
  workflow_dispatch:

jobs:
  macos-screenshots:
    name: Capture Live macOS App Screenshots
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS .app bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --mac dir --arm64 --publish never

      - name: Launch Lurkr.app and capture screenshots
        run: |
          set -euo pipefail
          APP_BIN=$(find release -maxdepth 4 -type f -path '*/Lurkr.app/Contents/MacOS/Lurkr' | head -n 1)
          echo "Using app binary: $APP_BIN"
          test -x "$APP_BIN"
          node scripts/macos-screenshots.mjs "$APP_BIN" macos-screenshots
          ls -lh macos-screenshots

      - name: Upload macOS screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshots
          path: macos-screenshots/*
          if-no-files-found: error
          retention-days: 14
