name: Cross-Platform Test & Package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer and Electron main
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundles
        run: npm run build

  package:
    name: Package (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            artifact: lurkr-linux-x64
            cmd: npm run package:linux
            verify: test -f release/linux-unpacked/lurkr
            paths: |
              release/linux-unpacked/**
          - label: Windows x64 (NSIS, Portable, Zip)
            os: windows-latest
            artifact: lurkr-windows-x64
            cmd: npm run build && npx electron-builder --win nsis portable zip --x64
            verify: |
              test -f release/win-unpacked/Lurkr.exe
              ls release/*-win-x64-setup.exe release/*-win-x64-portable.exe release/*-win-x64.zip
            paths: |
              release/*-win-x64-setup.exe
              release/*-win-x64-portable.exe
              release/*-win-x64.zip
          - label: macOS Universal (x64 + arm64)
            os: macos-latest
            artifact: lurkr-macos-universal
            cmd: npm run package:mac
            verify: |
              test -d release/mac-universal/Lurkr.app
              test -f release/mac-universal/Lurkr.app/Contents/MacOS/Lurkr
              ls release/*-mac-universal.dmg release/*-mac-universal.zip
            paths: |
              release/*-mac-universal.dmg
              release/*-mac-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}
        shell: bash

      - name: Verify packaged output
        run: ${{ matrix.verify }}
        shell: bash

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
